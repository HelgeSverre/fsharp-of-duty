app = "fsharp-of-duty"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  # The server holds every built-in map compiled in memory — ~195 MB RSS since
  # the classic BSP maps landed. 256 MB left the runtime thrashing: minutes-long
  # startup, seconds-long readiness probes, a critical health check.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
