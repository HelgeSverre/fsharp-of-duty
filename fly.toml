app = "fsharp-of-duty"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  # Maps compile on demand through the registry cache, so the server carries
  # only the rooms it hosts: ~59 MB RSS at boot. If an op /map-cycles through
  # many BSP maps in one process the cache grows per map visited — bump this
  # before blaming the sim.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
