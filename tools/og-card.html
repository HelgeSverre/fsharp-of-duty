<!doctype html>
<!-- Source for website/og.png. Regenerate: open in a 1200x630 browser window
     and screenshot (or ask Claude to redo it). Not served by the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #090b08;
    --paper: #e9dfc5;
    --muted: #a9a38f;
    --olive: #8d9563;
    --signal: #e45225;
    --line: rgba(233, 223, 197, .18);
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    --body: Inter, ui-sans-serif, system-ui, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: var(--ink); color: var(--paper); font-family: var(--body);
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .noise {
    position: absolute; inset: 0; pointer-events: none; opacity: .12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  .grid {
    position: absolute; inset: 0; opacity: .35;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 105px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 105px 100%;
    mask-image: radial-gradient(ellipse at 85% 20%, black, transparent 75%);
  }
  .brand { display: grid; grid-template-columns: 56px auto; column-gap: 14px; font: 30px/1 var(--display); letter-spacing: .07em; }
  .brand-mark {
    grid-row: 1 / 3; width: 56px; height: 56px; display: grid; place-items: center;
    color: var(--ink); background: var(--signal); transform: skew(-5deg); font-size: 24px;
  }
  .brand small { color: var(--muted); font: 13px/1.4 var(--body); letter-spacing: .25em; }
  h1 { font: 118px/0.94 var(--display); letter-spacing: .015em; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--signal); }
  .sub { margin-top: 26px; font-size: 26px; color: var(--muted); max-width: 760px; line-height: 1.4; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 22px; }
  .foot .url { color: var(--olive); font-size: 19px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
  .foot .tags { color: var(--muted); font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
  .scope {
    position: absolute; right: 84px; top: 96px; width: 210px; height: 210px;
    border: 2px solid var(--olive); border-radius: 50%; opacity: .8;
    box-shadow: inset 0 0 0 26px rgba(141, 149, 99, .08);
  }
  .scope::before, .scope::after { content: ""; position: absolute; background: var(--signal); }
  .scope::before { left: 50%; top: 8%; bottom: 8%; width: 2px; transform: translateX(-50%); }
  .scope::after { top: 50%; left: 8%; right: 8%; height: 2px; transform: translateY(-50%); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="scope"></div>
  <div class="brand">
    <span class="brand-mark">I/S</span>
    <span>IRONSIGHT</span>
    <small>F# OF DUTY</small>
  </div>
  <div>
    <h1>An FPS built<br><em>entirely</em> from code.</h1>
    <p class="sub">An asset-free multiplayer WWII shooter written in F# — every map, weapon, mesh, sound, and font is generated at runtime.</p>
  </div>
  <div class="foot">
    <span class="url">fsharp-of-duty.fly.dev</span>
    <span class="tags">Open source · Windows · macOS · Linux</span>
  </div>
</body>
</html>
