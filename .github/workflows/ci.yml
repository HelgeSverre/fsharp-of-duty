name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ironsight.sln

      - name: Verify formatting
        run: dotnet format Ironsight.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Ironsight.sln --no-restore

      - name: Test
        run: dotnet test Ironsight.sln --no-build --no-restore --nologo --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
